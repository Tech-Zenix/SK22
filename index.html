<style>
:root{--cream:#F4F0EA;--ink:#0D0D0D;--gold:#B8893B;--teal:#1F4D4F;--wine:#6B2D2D}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font:16px/1.6 Inter,sans-serif;overflow-x:hidden}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
em{font-style:italic;color:var(--gold)}
.brand,.portal{position:fixed;top:18px;z-index:50;font-size:12px;letter-spacing:.15em;text-transform:uppercase;mix-blend-mode:difference;color:#fff;text-decoration:none}
.brand{left:22px}.portal{right:22px;border:1px solid #fff;padding:6px 14px;border-radius:99px}
nav{position:fixed;left:22px;bottom:22px;z-index:50;background:rgba(244,240,234,.75);backdrop-filter:blur(10px);border:1px solid rgba(13,13,13,.15);border-radius:14px;padding:12px 16px;font-size:12px}

nav a.on{opacity:1;font-weight:600}nav a b{width:22px;font-family:'Cormorant Garamond',serif;font-size:15px}
#bar{height:2px;background:var(--gold);width:0;margin-top:8px}
section{position:relative;padding:14vh 6vw 16vh}
.torn{clip-path:polygon(0 12px,4% 0,9% 10px,15% 2px,22% 12px,30% 0,38% 9px,46% 1px,54% 11px,62% 0,70% 10px,78% 2px,86% 12px,94% 0,100% 8px,100% 100%,0 100%);margin-top:-12px}
h2{font-family:'Cormorant Garamond',serif;font-size:clamp(2.6rem,7vw,6rem);line-height:1;margin-bottom:.4em}
.num{font:italic 700 1.4rem 'Cormorant Garamond',serif;color:var(--gold);display:block;margin-bottom:8px}
.dark{background:var(--ink);color:var(--cream)}.teal{background:var(--teal);color:var(--cream)}
#hero{height:220vh;padding:0}
.stick{position:sticky;top:0;height:100vh;display:grid;place-items:center;overflow:hidden;background:var(--ink)}
.frame{position:absolute;inset:0;background:radial-gradient(circle at 30% 30%,#2c6366,var(--teal) 45%,#0b2223);clip-path:inset(var(--i,30%) round 24px);display:grid;place-items:center;text-align:center;color:var(--cream);padding:6vw}
.frame h1{font-family:'Cormorant Garamond',serif;font-size:clamp(3rem,11vw,10rem);line-height:.9;font-weight:700}
.frame p{max-width:560px;margin:24px auto 0;opacity:.85}
.fl{position:absolute;font-family:'Cormorant Garamond',serif;font-size:clamp(4rem,12vw,11rem);color:var(--gold);opacity:.25;pointer-events:none;will-change:transform}

.card{background:rgba(255,255,255,.55);backdrop-filter:blur(8px);border:1px solid rgba(13,13,13,.12);border-radius:20px;padding:26px;transition:.4s}
.card:hover{transform:translateY(-6px);box-shadow:0 18px 40px rgba(0,0,0,.12)}
.card.big{grid-column:span 2;background:var(--ink);color:var(--cream)}
.card .v{font:700 4rem/1 'Cormorant Garamond',serif;color:var(--gold)}
.card h3{font-family:'Cormorant Garamond',serif;font-size:1.6rem;line-height:1.1;margin:8px 0}
.card small{opacity:.7}
#tl{display:flex;gap:28px;overflow-x:auto;padding:20px 0 30px;scroll-snap-type:x mandatory}
.ms{flex:0 0 min(360px,80vw);scroll-snap-align:start;background:var(--cream);color:var(--ink);border-radius:18px;overflow:hidden}
.ms.hl{outline:2px solid var(--gold)}
.ms img{width:100%;height:200px;object-fit:cover;display:block;background:#8a7a5c}
.ms div{padding:18px}.ms time{color:var(--gold);font:italic 700 1.3rem 'Cormorant Garamond',serif}
.ms h3{font-family:'Cormorant Garamond',serif;font-size:1.7rem;line-height:1.1}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0 30px}
input{flex:1;min-width:220px;padding:12px 18px;border:1px solid var(--ink);background:transparent;border-radius:99px;font:inherit}
.chip{padding:10px 16px;border:1px solid var(--ink);border-radius:99px;background:none;cursor:pointer;font:inherit;font-size:13px}
.chip.on{background:var(--ink);color:var(--cream)}
#grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px}
.st{position:relative;aspect-ratio:3/4;border-radius:6px;overflow:hidden;cursor:pointer;background:var(--teal);border:0;text-align:left;color:var(--cream);transition:.4s}
.st:hover{transform:rotate(-1.5deg) scale(1.03)}
.st img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:sepia(.35) contrast(1.05)}
.st .in{position:absolute;inset:0;display:grid;place-items:center;font:italic 700 4rem 'Cormorant Garamond',serif;color:var(--gold);opacity:.6}
.st .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 14px 14px;background:linear-gradient(transparent,rgba(0,0,0,.85))}
.st .cap span{font-size:11px;letter-spacing:.15em;color:var(--gold)}
.st .cap h4{font:700 1.35rem/1.1 'Cormorant Garamond',serif}
.rv{opacity:0;transform:translateY(40px);transition:1s cubic-bezier(.2,.7,.2,1)}.rv.in{opacity:1;transform:none}
#dr{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--cream);z-index:100;transform:translateX(105%);transition:.5s cubic-bezier(.2,.7,.2,1);overflow-y:auto;padding:36px 30px;box-shadow:-20px 0 60px rgba(0,0,0,.3)}
#dr.open{transform:none}
#dr h3{font:700 2.6rem/1 'Cormorant Garamond',serif;margin:14px 0 18px}
#dr img{width:100%;height:260px;object-fit:cover;border-radius:8px;filter:sepia(.3)}
#dr dt{font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);margin-top:14px}
#x{position:absolute;top:14px;right:18px;background:none;border:0;font-size:28px;cursor:pointer}
footer{text-align:center;padding:60px 6vw;font-size:13px;opacity:.7}
@media(max-width:800px){.bento{grid-template-columns:1fr 1fr}nav a span{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}

body:not(.ready){overflow:hidden}
#pre{position:fixed;inset:0;z-index:400;background:var(--ink);color:var(--gold);display:grid;place-content:center;text-align:center;font:italic 700 clamp(5rem,18vw,14rem)/1 'Cormorant Garamond',serif;clip-path:inset(0)}
#pre p{font:12px Inter,sans-serif;letter-spacing:.4em;color:var(--cream);margin-top:10px}
.ready #pre{clip-path:inset(0 0 100% 0);transition:clip-path 1.1s cubic-bezier(.77,0,.18,1) .25s;pointer-events:none}
#cur{position:fixed;left:-18px;top:-18px;width:36px;height:36px;border:1.5px solid var(--gold);border-radius:50%;z-index:300;pointer-events:none;opacity:0;transition:scale .3s,background .3s,opacity .3s}
#cur.on{opacity:1}#cur.big{scale:2.4;background:rgba(184,137,59,.22)}
@media(pointer:coarse){#cur{display:none}}
.w{display:inline-block;white-space:nowrap}
.ch{display:inline-block;opacity:0;transform:translateY(80%) rotate(10deg);transition:transform 1s cubic-bezier(.2,.8,.2,1) calc(.55s + var(--d)),opacity .8s calc(.55s + var(--d))}
.ready .ch{opacity:1;transform:none}
.fl{animation:bob 7s ease-in-out infinite alternate}
@keyframes bob{to{translate:0 -36px}}
.frame>div{position:relative}
#dna{position:absolute;inset:0;width:100%;height:100%}
.hint{margin-top:36px;font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);animation:hint 1.6s ease-in-out infinite}
@keyframes hint{50%{transform:translateY(10px);opacity:.4}}
.portal{transition:transform .2s}
h2.rv{opacity:1;transform:none;clip-path:inset(-10% 100% -15% 0);transition:clip-path 1.2s cubic-bezier(.77,0,.18,1)}
h2.rv.in{clip-path:inset(-10% -2% -15% 0)}
.marq{background:var(--ink);color:var(--cream);overflow:hidden;white-space:nowrap;padding:34px 0 50px}
.marq div{display:block;width:max-content;animation:mq 70s linear infinite;font:italic 700 clamp(2.2rem,6vw,4.5rem)/1.3 'Cormorant Garamond',serif}
.marq .r{animation-direction:reverse;color:transparent;-webkit-text-stroke:1px var(--gold)}
.marq span::after{content:'✦';color:var(--gold);margin:0 .6em;-webkit-text-stroke:0}
@keyframes mq{to{transform:translateX(-50%)}}
.bento .card,.st{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));transition:transform .2s,box-shadow .4s,opacity 1s;will-change:transform}
.bento .card:not(.in){opacity:0;transform:translateY(50px) scale(.95)}
.bento .card:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) translateZ(10px)}
.st:hover{transform:perspective(800px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)) scale(1.04)}
.st::after{content:'';position:absolute;inset:0;background:radial-gradient(220px at var(--mx,50%) var(--my,50%),rgba(184,137,59,.4),transparent);opacity:0;transition:.3s;pointer-events:none}
.st:hover::after{opacity:1}
.st{animation:pop .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--k,0)*28ms)}
@keyframes pop{from{opacity:0;transform:translateY(40px) scale(.85)}}
#tl{cursor:grab;user-select:none;padding-bottom:60px}
.ms img{pointer-events:none;transition:transform .8s}.ms:hover img{transform:scale(1.1)}
.ms{transition:transform .5s}.ms:nth-child(odd){transform:rotate(-1.5deg)}.ms:nth-child(even){transform:rotate(1.5deg) translateY(36px)}.ms:hover{transform:none}
@media(prefers-reduced-motion:reduce){.fl,.marq div,.hint{animation:none}}

/* Phần III: nền dát vàng Phục Hưng */
#stu{isolation:isolate;overflow:hidden;background:linear-gradient(135deg,#d6ad57,#f3dc93 32%,#c39a47 62%,#8a6228)}
#stu::before{content:'';position:absolute;inset:0;z-index:-1;opacity:.5;mix-blend-mode:multiply;background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .3 0 0 0 0 .2 0 0 0 0 .05 0 0 0 .6 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#stu::after{content:'';position:absolute;top:0;bottom:0;left:-40%;width:40%;z-index:-1;pointer-events:none;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:sh 9s ease-in-out infinite;will-change:transform}
@keyframes sh{to{transform:translateX(450%) skewX(-20deg)}}
#stu .fr{position:absolute;inset:30px 3vw 28px;z-index:-1;border:4px double rgba(13,13,13,.4);pointer-events:none}
#stu .wm{position:absolute;right:4vw;top:6vh;z-index:-1;font:italic 700 30vw/1 'Cormorant Garamond',serif;color:transparent;-webkit-text-stroke:2px rgba(107,45,45,.28);pointer-events:none;animation:bob 8s ease-in-out infinite alternate}
#stu em{color:var(--wine)}#stu .num{color:var(--ink)}
#stu input{background:rgba(255,255,255,.4)}
#stu .st{box-shadow:0 0 0 4px var(--cream),0 0 0 5px rgba(13,13,13,.55),0 18px 34px rgba(60,30,0,.4)}
#stu:not(.vis)::after,#stu:not(.vis) .wm,.marq:not(.vis) div{animation-play-state:paused}
@media(prefers-reduced-motion:reduce){#stu::after,#stu .wm{animation:none}}
</style>

<script>

const IMG=['photo-1578301978693-85fa9c0320b9','photo-1577083552431-6e5fd01aa342','photo-1541961017774-22349e4a1262','photo-1544967082-d9d25d867d66','photo-1513364776144-60967b0f800f','photo-1579783902614-a3fb3927b6a5'].map(i=>`https://images.unsplash.com/${i}?w=600&q=70&auto=format&fit=crop`);
const N=["Bùi Lê Hà An","Bùi Trần Kiều Anh","Hoàng Tuấn Anh","Phan Quốc Dũng","Nguyễn Thị Hoài Duyên","Nguyễn Hoàng Kiều Dương","Nguyễn Phạm Ánh Dương","Phan Thùy Dương","Trịnh Ánh Dương","Phạm Nguyệt Hà","Đậu Hoàng Gia Hân","Lê Thị Thanh Huyền","Phạm Tấn Hưng","Nguyễn Việt Khoa","Biện Thị Thùy Linh","Lê Hoàng Linh","Lê Thị Hà Linh","Lê Thị Thùy Linh","Nguyễn Ngọc Huyền My","Đoàn Trần Ny Na","Hoàng Ngọc Nam","Phan Thị Nga","Bùi Quỳnh Ngân","Ngô Thị Bảo Ngọc","Trần Thanh Nhàn","Hoàng Thiện Nhân","Trần Thảo Như","Nguyễn Lan Phương","Trương Hữu Nhật Quang","Nguyễn Tiến Quân","Nguyễn Thế Sơn","Nguyễn Thị Huyền Tâm","Lê Đình Quốc Thái","Hoàng Thông","Nguyễn Hoàng Đức Tuấn"];
const A=["Giải Nhì HSG cấp trường môn Sinh","Giải KK HSG cấp tỉnh","Học sinh Xuất sắc kỳ I","Thủ khoa bài kiểm tra Di truyền","Giải Ba Hùng biện Khoa học","Đội trưởng đội Cắm trại","Giải Nhất Thiết kế Poster Sinh học","Học sinh 3 tốt cấp trường","Giải KK Olympic Sinh học 10"];
const P=["Điềm tĩnh, tỉ mỉ như người soi kính hiển vi","Năng nổ, luôn là người xung phong","Hài hước, cứ nói là cả lớp cười","Trầm lặng nhưng đầu óc đầy ý tưởng","Sáng tạo, mê vẽ sơ đồ quá trình","Cẩn thận, ghi chép đẹp nhất lớp","Hiền lành, ai cần cũng giúp","Quyết đoán, tư duy logic sắc bén"];
const V=["Giấu một tập truyện tranh dưới ngăn bàn","Mê nghe nhạc không lời lúc học bài","Từng ngủ quên đến tận tiết cuối","Bí mật nuôi một chậu xương rồng tên Mendel","Chuyên gia ăn vặt giờ ra chơi","Viết nhật ký bằng… thuật ngữ sinh học","Mê chụp ảnh hoàng hôn sau trường","Có biệt tài bắt chước giọng thầy cô"];
const H=["“Để mình kiểm tra lại đã!”","“Cái này có trong đề không nhỉ?”","“Tế bào nào cũng có ước mơ.”","“5 phút nữa thôi!”","“Sinh học là nghệ thuật.”","“Tin mình đi, chuẩn rồi.”","“Hôm nay ai trực nhật vậy?”","“Cố lên, sắp nghỉ rồi!”"];
const DEF=()=>({
 info:{name:"SK22 - CHT",teacher:"Nguyễn Thị Mai Hồng",slogan:"Mỗi tế bào một ước mơ — cùng nhau nở rộ."},
 stats:[{id:"s1",value:"35",title:"Thành viên",desc:"Một tập thể, một nhịp đập",big:true},{id:"s2",value:"12",title:"Giải HSG",desc:"Cấp trường & cấp tỉnh"},{id:"s3",value:"9.2",title:"GPA trung bình",desc:"Cả lớp, học kỳ I"},{id:"s4",value:"1",title:"Giải Nhất cắm trại",desc:"Khối 10 toàn trường"},{id:"s5",value:"100%",title:"Gắn kết",desc:"Không ai bị bỏ lại",big:true}],

});

function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}const d=DEF();try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}return d}
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let filter='all',term='';
const GROUPS={all:null,'A–D':/^[A-DĐ]/,'E–L':/^[E-L]/,'M–Q':/^[M-Q]/,'R–Z':/^[R-Z]/};
const last=n=>n.trim().split(/\s+/).pop().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/gi,'d').toUpperCase();

  document.title=`${i.name} · The Renaissance Edition`;
  $('#bento').innerHTML=D.stats.map(s=>`<article class="card rv${s.big?' big':''}"><div class="v">${esc(s.value)}</div><h3>${esc(s.title)}</h3><small>${esc(s.desc)}</small></article>`).join('');
  $('#tl').innerHTML=D.timeline.map(t=>`<article class="ms${t.highlight?' hl':''}"><img loading="lazy" src="${esc(t.image)}" alt="" onerror="this.style.visibility='hidden'"><div><time>${esc(t.date)}</time><h3>${esc(t.title)}</h3><p>${esc(t.description)}</p></div></article>`).join('');
  grid();
}
function grid(){
  const t=term.trim().toLowerCase(),re=GROUPS[filter];
  $('#grid').innerHTML=D.students.map((s,i)=>({s,i})).filter(({s})=>(!t||s.name.toLowerCase().includes(t))&&(!re||re.test(last(s.name)))).map(({s,i})=>`<button class="st" data-i="${i}"><div class="in">${ini(s.name)}</div><img loading="lazy" src="${esc(s.avatar)}" alt="" onerror="this.remove()"><div class="cap"><span>№ ${String(i+1).padStart(2,'0')}</span><h4>${esc(s.name)}</h4></div></button>`).join('')||'<p>Không tìm thấy học sinh.</p>';
}
function open(i){
  const s=D.students[i];
  $('#drc').innerHTML=`<span class="num">№ ${String(i+1).padStart(2,'0')}</span><img src="${esc(s.avatar)}" alt="" onerror="this.remove()"><h3>${esc(s.name)}</h3><dl><dt>Ngày sinh</dt><dd>${esc(s.dob)}</dd><dt>Thành tích</dt><dd>${esc(s.achievements)}</dd><dt>Tính cách</dt><dd>${esc(s.personality)}</dd><dt>Đời tư</dt><dd>${esc(s.privateLife)}</dd><dt>Nét nổi bật</dt><dd>${esc(s.highlights)}</dd></dl>`;
  $('#dr').classList.add('open');$('#dr').setAttribute('aria-hidden','false');
}
const close=()=>{$('#dr').classList.remove('open');$('#dr').setAttribute('aria-hidden','true')};
$('#grid').onclick=e=>{const b=e.target.closest('.st');if(b)open(+b.dataset.i)};
$('#x').onclick=close;addEventListener('keydown',e=>e.key==='Escape'&&close());
$('#q').oninput=e=>{term=e.target.value;grid()};
$('#chips').innerHTML=Object.keys(GROUPS).map(k=>`<button class="chip${k==='all'?' on':''}" data-k="${k}">${k==='all'?'Tất cả':k}</button>`).join(' ');
$('#chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;filter=b.dataset.k;document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',c===b));grid()};
// Đồng bộ thời gian thực từ panel.html
addEventListener('storage',e=>{if(e.key===KEY||e.key===null){D=load();render()}});
// Mục lục La Mã + tiến độ
const secs=[...document.querySelectorAll('section')],R=['·','I','II','III'];
$('#idx').innerHTML=secs.map((s,i)=>`<a href="#${s.id}" data-id="${s.id}"><b>${R[i]}</b><span>${s.dataset.n}</span></a>`).join('');
// Scroll: hero mở rộng, parallax, tiến độ
const hero=$('#hero'),fr=$('#frame'),fl=[...document.querySelectorAll('.fl')],bar=$('#bar');
let tick=false;
function onScroll(){
  tick=false;const y=scrollY,hh=hero.offsetHeight-innerHeight;
  fr.style.setProperty('--i',(30*(1-Math.min(1,y/(hh*.8))))+'%');
  fl.forEach(f=>f.style.transform=`translateY(${y*f.dataset.s}px) rotate(${y*.02}deg)`);
  bar.style.width=(y/(document.body.scrollHeight-innerHeight)*100)+'%';
}
addEventListener('scroll',()=>{if(!tick){tick=true;requestAnimationFrame(onScroll)}},{passive:true});
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('in');if(e.target.tagName==='SECTION')document.querySelectorAll('#idx a').forEach(a=>a.classList.toggle('on',a.dataset.id===e.target.id))}}),{threshold:.2});
secs.forEach(s=>io.observe(s));document.querySelectorAll('.rv').forEach(r=>io.observe(r));

// ===== MOTION =====
(function(){const pc=$('#pc'),t0=performance.now(),rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
 (function f(t){const p=rm?1:Math.min(1,(t-t0)/1400);pc.textContent=Math.round(p*100);if(p<1)requestAnimationFrame(f);else document.body.classList.add('ready')})(t0)})();
// Tách chữ tiêu đề hero
(function(el){const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT),ts=[];while(w.nextNode())ts.push(w.currentNode);let k=0;
 ts.forEach(t=>{const f=document.createDocumentFragment();t.textContent.split(/(\s+)/).forEach(wd=>{if(!wd)return;if(/^\s+$/.test(wd)){f.append(' ');return}
  const ws=document.createElement('span');ws.className='w';[...wd].forEach(c=>{const s=document.createElement('span');s.className='ch';s.textContent=c;s.style.setProperty('--d',(k++*40)+'ms');ws.append(s)});f.append(ws)});t.replaceWith(f)})})($('#hT'));
// Xoắn kép DNA
const cv=$('#dna'),g2=cv.getContext('2d');let CW=0,CH=0;
function sz(){const k=Math.min(devicePixelRatio||1,1.5);CW=cv.offsetWidth;CH=cv.offsetHeight;cv.width=CW*k;cv.height=CH*k;g2.setTransform(k,0,0,k,0,0)}
sz();addEventListener('resize',sz);
(function dna(t){requestAnimationFrame(dna);if(scrollY>innerHeight*2.1)return;g2.clearRect(0,0,CW,CH);
 [.1,.9].forEach(c0=>{for(let i=0;i<46;i++){const y=i*CH/45,a=i*.4+t*.0012+scrollY*.004,s=Math.sin(a),z=Math.cos(a),x=CW*c0,r=Math.min(CW*.06,54);
  g2.strokeStyle='rgba(244,240,234,.18)';g2.beginPath();g2.moveTo(x-s*r,y);g2.lineTo(x+s*r,y);g2.stroke();
  g2.fillStyle='#B8893B';g2.beginPath();g2.arc(x+s*r,y,3+z*2,0,7);g2.fill();
  g2.fillStyle='#F4F0EA';g2.beginPath();g2.arc(x-s*r,y,3-z*2,0,7);g2.fill()}})})(0);
// Con trỏ vàng
const cur=$('#cur');let mx=0,my=0,px=0,py=0;
addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;cur.classList.add('on')});
(function f(){px+=(mx-px)*.18;py+=(my-py)*.18;cur.style.transform=`translate(${px}px,${py}px)`;requestAnimationFrame(f)})();
document.addEventListener('pointerover',e=>cur.classList.toggle('big',!!e.target.closest('a,button,.st,.card,.ms,input')));
// Nghiêng 3D + đèn rọi
document.addEventListener('pointermove',e=>{const c=e.pointerType==='mouse'&&e.target.closest('.card,.st');if(!c)return;
 const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;
 c.style.setProperty('--ry',(x-.5)*14+'deg');c.style.setProperty('--rx',(.5-y)*14+'deg');c.style.setProperty('--mx',x*100+'%');c.style.setProperty('--my',y*100+'%')});
document.addEventListener('pointerout',e=>{const c=e.target.closest('.card,.st');if(c){c.style.removeProperty('--rx');c.style.removeProperty('--ry')}});
// Nút từ tính
const pt=$('.portal');pt.addEventListener('pointermove',e=>{const r=pt.getBoundingClientRect();pt.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.3}px,${(e.clientY-r.top-r.height/2)*.5}px)`});
pt.addEventListener('pointerleave',()=>pt.style.transform='');
// Kéo để lướt timeline
const tl=$('#tl');let dx=0,sl=0,dn=0;
tl.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;dn=1;dx=e.clientX;sl=tl.scrollLeft;tl.style.scrollSnapType='none'});
addEventListener('pointermove',e=>{if(dn)tl.scrollLeft=sl-(e.clientX-dx)});
addEventListener('pointerup',()=>{if(dn){dn=0;tl.style.scrollSnapType=''}});
// Đếm số + marquee + stagger (chạy lại mỗi lần render)
const cio=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;cio.unobserve(e.target);const v=e.target,n=+v.dataset.n,d=+v.dataset.d,u=v.dataset.u,t0=performance.now();
 (function f(t){const p=Math.min(1,(t-t0)/1500);v.textContent=(n*(1-Math.pow(1-p,4))).toFixed(d)+u;if(p<1)requestAnimationFrame(f)})(t0)}),{threshold:.5});
function fx(){
 const nm=D.students.map(s=>`<span>${esc(s.name)}</span>`).join('');
 $('#marq').innerHTML=`<div>${nm}${nm}</div><div class="r">${nm}${nm}</div>`;
 document.querySelectorAll('.v').forEach(v=>{const t=v.textContent,n=parseFloat(t.replace(',','.'));if(isNaN(n))return;
  v.dataset.n=n;v.dataset.d=(t.match(/[.,](\d+)/)||[,''])[1].length;v.dataset.u=t.replace(/[\d.,]/g,'');v.textContent='0'+v.dataset.u;cio.observe(v)});
 document.querySelectorAll('#bento .card').forEach((c,k)=>{c.style.transitionDelay=k*90+'ms';io.observe(c)});
}
const _r=render;render=function(){_r();fx()};
const _g=grid;grid=function(){_g();document.querySelectorAll('.st').forEach((b,k)=>b.style.setProperty('--k',k))};
new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('vis',e.isIntersecting))).observe($('#stu'));
new IntersectionObserver(es=>es.forEach(e=>e.target.classList.toggle('vis',e.isIntersecting))).observe($('#marq'));
D=load();render();onScroll();
</script>
</body>
</html>
