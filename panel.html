<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Studio · SK22 Member · Chuyên Sinh K22 · THPT Chuyên Hà Tĩnh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0D0C;--glass:rgba(20,26,23,.82);--gold:#D4AF37;--em:#34D399;--iv:#F4EFE6;--mut:rgba(244,239,230,.66);--line:rgba(244,239,230,.13);--err:#F08A8A;--spring:cubic-bezier(.34,1.56,.64,1);--r:14px;
--serif:'Cormorant Garamond',Georgia,serif;--sans:'Plus Jakarta Sans',system-ui,sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace}
*{box-sizing:border-box;margin:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--iv);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--em);outline-offset:2px}
.mono{font-family:var(--mono)}
.mut,small{color:var(--mut)}
.empty{color:var(--mut);font-style:italic}

/* Tableau */
.tableau{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#2c5d8a 0%,#6fa0c6 40%,#cfe0e8 68%,#40583f 100%)}
.tableau::before,.tableau::after{content:"";position:absolute;inset:-10%}
.tableau::before{background:radial-gradient(ellipse 28% 14% at 22% 30%,#fff 0,transparent 70%),radial-gradient(ellipse 34% 16% at 70% 24%,#f4ede2 0,transparent 70%),radial-gradient(ellipse 22% 12% at 84% 58%,#fff 0,transparent 70%);filter:blur(14px);animation:drift 40s ease-in-out infinite alternate}
.tableau::after{background:radial-gradient(ellipse 9% 46% at 8% 66%,#16301f 0,transparent 72%),radial-gradient(ellipse 7% 40% at 15% 70%,#1d3b27 0,transparent 72%),radial-gradient(ellipse 30% 38% at 96% 10%,#8d1f2c 0,transparent 70%);filter:blur(6px)}
.veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(11,13,12,.5),var(--bg) 94%)}
@keyframes drift{to{transform:translateX(6%)}}

/* Controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--iv);padding:.6rem 1rem;border-radius:10px;font-family:inherit;font-size:.85rem;font-weight:600;line-height:1.2;cursor:pointer;text-decoration:none;transition:transform .35s var(--spring),background .2s,border-color .2s}
.btn:hover:not(:disabled){border-color:var(--gold);transform:translateY(-1px)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#16130a}
.btn.em{background:rgba(52,211,153,.16);border-color:rgba(52,211,153,.55);color:var(--em)}
.btn.ghost{background:transparent}
.btn.sm{padding:.38rem .75rem;font-size:.78rem}
.btn.wide{width:100%}
.btn.danger:hover:not(:disabled){border-color:var(--err);color:var(--err)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.end{justify-content:flex-end;margin-top:16px}
.f{display:grid;gap:6px;margin-bottom:16px}
.f>span{font-size:.8rem;font-weight:600;color:var(--mut)}
input,textarea,select{width:100%;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;color:var(--iv);padding:.65rem .8rem;font:inherit}
textarea{resize:vertical;min-height:7rem}
select option{background:#101512}
input::placeholder,textarea::placeholder{color:rgba(244,239,230,.4)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.seg button{border:0;background:transparent;color:var(--mut);padding:.4rem .8rem;border-radius:8px;font:600 .8rem var(--sans);cursor:pointer;transition:background .25s,color .25s}
.seg button[aria-selected=true],.seg button[aria-checked=true],.seg button[aria-pressed=true]{background:var(--gold);color:#16130a}
.note{padding:.75rem 1rem;margin-bottom:16px;border:1px solid rgba(212,175,55,.4);border-radius:10px;background:rgba(212,175,55,.08);font-size:.85rem}
.fs{border:0;padding:0;min-width:0}
.badge{display:inline-block;font-size:.72rem;color:var(--gold);border:1px solid rgba(212,175,55,.5);border-radius:99px;padding:0 .55rem}

/* Gate */
#gate{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto}
.gbig{position:absolute;left:clamp(16px,5vw,80px);bottom:clamp(8px,4vh,48px);font:italic 500 clamp(3.4rem,13vw,11rem)/.88 var(--serif);color:var(--iv);opacity:.9;pointer-events:none;text-shadow:0 8px 40px rgba(0,0,0,.45)}
.gcard{position:relative;width:min(100%,410px);padding:30px;border:1px solid var(--line);border-radius:18px;background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.gcard h2{font:600 2.3rem/1 var(--serif);margin-bottom:4px}
.member-pill{display:inline-flex;align-items:center;gap:8px;margin:16px 0 18px;padding:8px 14px;border-radius:99px;border:1px solid rgba(212,175,55,.55);background:rgba(212,175,55,.12);color:var(--gold);font:600 .82rem var(--mono);letter-spacing:.08em;width:100%;justify-content:center}
.member-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--em);box-shadow:0 0 10px var(--em)}
.gm{min-height:1.4em;margin-bottom:10px;color:var(--err);font-size:.85rem}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.back{display:block;width:100%;margin-top:16px;text-align:center;color:var(--mut);font-size:.85rem;background:none;border:0;cursor:pointer;text-decoration:underline}

/* App shell */
#app{display:grid;grid-template-columns:250px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:24px 16px;border-right:1px solid var(--line);background:var(--glass);display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{font:600 1.5rem/1.1 var(--serif)}
.brand small{display:block;font:400 .75rem var(--sans)}
#nav{display:grid;gap:4px}
.navb{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;align-items:baseline;text-align:left;width:100%;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--iv);padding:.6rem .7rem;font:500 .86rem var(--sans);cursor:pointer;transition:background .25s,transform .35s var(--spring)}
.navb:hover{background:rgba(255,255,255,.05);transform:translateX(3px)}
.navb[aria-current=page]{border-color:rgba(212,175,55,.5);background:rgba(212,175,55,.1)}
.navb .mono{color:var(--gold);font-size:.75rem}
.navb small{grid-column:2;font-size:.72rem}
.who{margin-top:auto;display:grid;gap:8px;padding-top:14px;border-top:1px solid var(--line);font-size:.85rem}
.main{display:flex;flex-direction:column;min-width:0}
.head{position:relative;padding:28px clamp(16px,3vw,40px) 24px;overflow:hidden;border-bottom:1px solid var(--line)}
.head .tableau{opacity:.55}
.headrow{position:relative;display:flex;justify-content:space-between;gap:16px;align-items:flex-start;flex-wrap:wrap}
h1{font:600 clamp(2.2rem,5vw,4.2rem)/.95 var(--serif);letter-spacing:-.01em}
h1 .tn{font-size:.9rem;letter-spacing:0;color:var(--gold);vertical-align:top;margin-right:.4rem}
.headact{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sync{display:inline-flex;gap:8px;align-items:center;font:500 .78rem var(--mono);padding:.4rem .75rem;border:1px solid var(--line);border-radius:99px;background:var(--glass)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--em);box-shadow:0 0 10px var(--em)}
.sync.dirty .dot{background:var(--gold);box-shadow:0 0 10px var(--gold);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.35}}
.work{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;padding:24px clamp(16px,3vw,40px);flex:1;align-items:start}
.prev{position:sticky;top:16px;display:grid;gap:12px}
.pvlabel{font-size:.8rem;color:var(--mut)}
.databar{position:sticky;bottom:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;padding:12px clamp(16px,3vw,40px);background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.databar .sp{flex:1}
.enter{animation:enter .55s var(--spring)}
@keyframes enter{from{opacity:0;transform:translateY(14px) scale(.99)}}

/* Panels & forms */
.panel{background:rgba(20,26,23,.7);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.panel h2{font:600 1.7rem/1.1 var(--serif);margin-bottom:16px}
.stack{display:grid;gap:16px}
.split{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.list{padding:12px}
.list ul{list-style:none;padding:0;margin-top:10px;max-height:62vh;overflow:auto;display:grid;gap:2px}
.list li.empty{padding:.5rem}
.sitem{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid transparent;border-radius:8px;background:transparent;color:var(--iv);padding:.45rem .55rem;font:500 .85rem var(--sans);cursor:pointer}
.sitem:hover{background:rgba(255,255,255,.05)}
.sitem[aria-current=true]{border-color:rgba(212,175,55,.5);background:rgba(212,175,55,.1)}
.sitem .mono{color:var(--gold);font-size:.75rem}
.sitem small{font-size:.68rem;white-space:nowrap}
.sitem small.ok{color:var(--em)}
.imgrow{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:start;padding:12px;border:1px dashed var(--line);border-radius:12px;background:rgba(255,255,255,.02)}
.thumb{width:96px;height:96px;border-radius:12px;border:1px solid var(--gold);background:rgba(255,255,255,.04) center/cover no-repeat;display:grid;place-items:center;font:600 .7rem var(--mono);color:var(--mut);text-align:center}
.imgctl{display:grid;gap:8px}
.lh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.lh h2{margin:0}
.items{list-style:none;padding:0;display:grid;gap:10px}
.item{display:grid;gap:8px;padding:12px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}

/* SK22/image/ Gallery Grid */
.gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(165px,1fr));gap:14px}
.gal-card{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:rgba(255,255,255,.03);display:flex;flex-direction:column}
.gal-card .gimg{aspect-ratio:1/1;background:#0d1310 center/cover no-repeat;border-bottom:1px solid var(--line)}
.gal-card .gmeta{padding:10px;display:grid;gap:6px;font-size:.76rem}
.gal-card .gname{font-family:var(--mono);color:var(--gold);word-break:break-all;font-size:.72rem}

/* Cards (live preview) */
.pv{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:var(--r);background:#101512}
.hero{min-height:300px;display:grid;align-items:end}
.hero .tableau,.pvbg{position:absolute;inset:0}
.pvbg{width:100%;height:100%;object-fit:cover}
.pvin{position:relative;padding:20px;white-space:pre-wrap}
.pvin h3{font:600 2.2rem/1 var(--serif)}
.pvin h4{font:italic 500 1.5rem/1.1 var(--serif);margin-top:14px}
.pvin .sub{color:var(--gold);font-weight:600}
.pcard{padding:20px}
.pcard .av{width:96px;height:96px;border-radius:50%;overflow:hidden;display:grid;place-items:center;background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.5);font:600 2rem var(--serif);margin-bottom:10px}
.pcard .av img{width:100%;height:100%;object-fit:cover}
.pcard h3{font:600 1.8rem/1.1 var(--serif);margin-bottom:10px}
.pcard section{margin-top:12px}
.pcard h4{font-size:.8rem;color:var(--gold);font-weight:600}
.pcard p{white-space:pre-wrap;font-size:.9rem}
.qcard{padding:16px;border-left:2px solid var(--gold);background:rgba(255,255,255,.03);border-radius:0 12px 12px 0}
.qcard blockquote{font:italic 500 1.35rem/1.35 var(--serif);white-space:pre-wrap}
.qcard figcaption{margin-top:6px;font-size:.82rem;color:var(--mut)}
.qcard small{display:block}
.mc{display:grid;gap:10px}
.mc img{width:100%;max-height:220px;object-fit:cover;border-radius:10px}
.mc h4{font:600 1.35rem/1.15 var(--serif);margin-top:4px}
.mc p{white-space:pre-wrap;font-size:.9rem}
.pvlist{display:grid;gap:10px}
.pvlist>*{margin:0}

/* Toast & dialog */
#toast{position:fixed;left:50%;bottom:84px;z-index:50;transform:translate(-50%,24px);opacity:0;pointer-events:none;padding:.7rem 1.2rem;border:1px solid var(--gold);border-radius:99px;background:var(--glass);backdrop-filter:blur(14px);font-weight:600;font-size:.88rem;transition:opacity .3s,transform .5s var(--spring)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--err);color:var(--err)}
dialog{background:#101512;color:var(--iv);border:1px solid var(--line);border-radius:16px;padding:24px;width:min(94vw,680px);margin:auto;max-height:86vh;overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.65);backdrop-filter:blur(4px)}
dialog h3{font:600 1.6rem/1.1 var(--serif);margin-bottom:8px}

@media(max-width:1180px){.work{grid-template-columns:1fr}.prev{position:static}}
@media(max-width:860px){
 #app{grid-template-columns:1fr}
 .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
 #nav{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto}
 .who{margin-top:0;display:flex;flex-wrap:wrap;align-items:center}
 .split{grid-template-columns:1fr}
 .list ul{max-height:240px}
 .imgrow{grid-template-columns:1fr}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- Unified Renaissance Vault Login Gate: SK22 Member only -->
<div id="gate" hidden>
  <div class="tableau"></div><div class="veil"></div>
  <p class="gbig" aria-hidden="true">Chuyên Sinh<br>Khóa 22</p>
  <main class="gcard">
    <h2>SK22 Member</h2>
    <p class="mut">Cổng Quản Trị Nội Dung · THPT Chuyên Hà Tĩnh</p>
    <div class="member-pill">
      <span class="dot"></span>
      <span>PORTAL ĐĂNG NHẬP: SK22 MEMBER</span>
    </div>
    <form id="gf" novalidate>
      <label class="f">
        <span id="gcl">Mật khẩu SK22 Member</span>

      </label>

      <button class="btn gold wide" id="gBtn" type="submit">Đăng nhập SK22 Member</button>
    </form>

  </main>
</div>

<!-- Workspace -->
<div id="app" hidden>
  <aside class="side">
    <div class="brand">Admin Studio<small>Chuyên Sinh K22 · THPT Chuyên Hà Tĩnh</small></div>
    <nav id="nav" aria-label="Các phân khu quản trị"></nav>
    <div class="who">
      <span id="who"></span>
      <button class="btn sm ghost" id="bOut" type="button">Đăng xuất</button>
    </div>
  </aside>
  <div class="main">
    <header class="head">
      <div class="tableau"></div><div class="veil"></div>
      <div class="headrow">
        <h1 id="h1"></h1>
        <div class="headact">
          <span class="sync" id="sync" role="status"><span class="dot"></span><span id="syncT"></span></span>

      <label class="btn" id="bImpL">Nhập csk22-data.json<input type="file" id="bImp" accept="application/json,.json" hidden></label>
      <span class="sp"></span>
      <button class="btn danger ghost" id="bReset" type="button">Khôi phục khung sườn gốc</button>
    </div>
  </div>
</div>

<datalist id="authors"></datalist>
<div id="toast" role="status"></div>
<dialog id="dlg"></dialog>

<script>
(()=>{'use strict';
/* ---------- Constants & schema ---------- */
const KEY='CSK22_HT_DATA_V1', SKEY='CSK22_HT_SESSION_V2';
const DEFAULT_PASS='maihong';
const API_DATA='/api/data', API_AUTH='/api/auth', API_IMAGE='/api/image';
const TEACHER='Nguyễn Thị Mai Hồng';
const NAMES=['Bùi Lê Hà An','Bùi Trần Kiều Anh','Hoàng Tuấn Anh','Phan Quốc Dũng','Nguyễn Thị Hoài Duyên','Nguyễn Hoàng Kiều Dương','Nguyễn Phạm Ánh Dương','Phan Thùy Dương','Trịnh Ánh Dương','Phạm Nguyệt Hà','Đậu Hoàng Gia Hân','Lê Thị Thanh Huyền','Phạm Tấn Hưng','Nguyễn Việt Khoa','Biện Thị Thùy Linh','Lê Hoàng Linh','Lê Thị Hà Linh','Lê Thị Thùy Linh','Nguyễn Ngọc Huyền My','Đoàn Trần Ny Na','Hoàng Ngọc Nam','Phan Thị Nga','Bùi Quỳnh Ngân','Ngô Thị Bảo Ngọc','Trần Thanh Nhàn','Hoàng Thiện Nhân','Trần Thảo Như','Nguyễn Lan Phương','Trương Hữu Nhật Quang','Nguyễn Tiến Quân','Nguyễn Thế Sơn','Nguyễn Thị Huyền Tâm','Lê Đình Quốc Thái','Hoàng Thông','Nguyễn Hoàng Đức Tuấn'];
const PF=['bio','experience','personality','achievements'];
const LBL={bio:'Tiểu sử',experience:'Kinh nghiệm',personality:'Tính cách',achievements:'Thành tích nổi bật'};
const GR=['10','11','12'];
const pad=n=>String(n).padStart(2,'0');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d');
const $=s=>document.querySelector(s);

const skeleton=()=>({version:1,updatedAt:null,
  school:{name:'Trường THPT Chuyên Hà Tĩnh',subtitle:'',intro:'',imageUrl:'',logo:'',address:'',message:''},
  className:'Chuyên Sinh Khóa 22',
  manifesto:'',
  klass:{name:'Chuyên Sinh Khóa 22',message:'',imageUrl:''},
  quotes:[],
  teacher:{name:TEACHER,avatar:'',bio:'',experience:'',personality:'',achievements:''},
  students:NAMES.map((name,i)=>({id:pad(i+1),name,avatar:'',bio:'',experience:'',personality:'',achievements:''})),
  moments:[],achievements:[],classAchievements:[],imageLibrary:[]});

function normalize(r){
  const s=skeleton();
  if(!r||typeof r!=='object')return s;
  const mix=(d,x)=>{if(x&&typeof x==='object'&&!Array.isArray(x))for(const k in d)if(typeof x[k]==='string')d[k]=x[k]};
  mix(s.school,r.school);mix(s.klass,r.klass);mix(s.teacher,r.teacher);s.teacher.name=TEACHER;
  s.school.subtitle=s.school.subtitle||s.school.address||'';
  s.school.intro=s.school.intro||s.school.message||'';
  s.school.imageUrl=s.school.imageUrl||s.school.logo||'';
  s.school.address=s.school.subtitle;
  s.school.message=s.school.intro;
  s.school.logo=s.school.imageUrl;
  s.klass.message=s.klass.message||(typeof r.manifesto==='string'?r.manifesto:'');
  s.manifesto=s.klass.message;
  s.className=s.klass.name||'Chuyên Sinh Khóa 22';

  const by=new Map((Array.isArray(r.students)?r.students:[]).map((x,idx)=>[pad(parseInt(x&&x.id,10)||(idx+1)),x]));
  s.students.forEach(st=>{const x=by.get(st.id);if(x)[...PF,'avatar'].forEach(k=>{st[k]=String(x[k]??'')})});
  const rawAch=Array.isArray(r.achievements)&&r.achievements.length?r.achievements:(Array.isArray(r.classAchievements)?r.classAchievements:[]);
  const mapList=(arr,isQ)=> (Array.isArray(arr)?arr:[]).filter(x=>x&&typeof x==='object').map(x=>{
    const o={...x,id:x.id||uid()};
    if(!isQ)o.grade=GR.includes(String(o.grade))?String(o.grade):'10';
    return o;
  });
  s.quotes=mapList(r.quotes,true);
  s.moments=mapList(r.moments,false);
  s.achievements=mapList(rawAch,false);
  s.classAchievements=s.achievements;
  s.imageLibrary=Array.isArray(r.imageLibrary)?r.imageLibrary:[];
  s.updatedAt=typeof r.updatedAt==='string'?r.updatedAt:null;
  return s;
}

function setSync(customText){const s=$('#sync');if(!s)return;s.classList.toggle('dirty',isDirty);

function compress(file,max){return new Promise((res,rej)=>{const u=URL.createObjectURL(file),im=new Image();
  im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);
    let o=c.toDataURL('image/webp',.84);if(!o.startsWith('data:image/webp'))o=c.toDataURL('image/jpeg',.84);res(o)};
  im.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('img'))};im.src=u})}

/* ---------- Upload Image to /SK22/image/ via Server API & Immediate Sync ---------- */
async function uploadToSK22ImageFolder(file, prefixLabel, targetPath){
  toast('Đang nén & tải ảnh lên /SK22/image/...');
  setSync('Đang tải ảnh lên /SK22/image/...');
  const maxDim = (targetPath && targetPath.endsWith('avatar')) ? 640 : 1400;
  const dataUrl = await compress(file, maxDim);
  const cleanPrefix = fold(prefixLabel || 'sk22').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'sk22';

  let finalUrl = dataUrl;
  try{
    const res = await fetch(API_IMAGE, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-sk22-password': (ses && ses.password) || DEFAULT_PASS,
        'Authorization': 'Bearer ' + ((ses && ses.password) || DEFAULT_PASS)
      },
      body: JSON.stringify({
        dataUrl,
        prefix: cleanPrefix,
        label: prefixLabel || file.name
      })
    });
    if(res.ok){
      const j = await res.json();
      if(j && j.url){
        finalUrl = j.url;
      }
    }
  }catch{}

  const entry = {
    filename: finalUrl.startsWith('/SK22/image/') ? finalUrl.replace('/SK22/image/','') : (`${cleanPrefix}-${Date.now().toString(36)}.webp`),
    url: finalUrl,
    label: prefixLabel || file.name,
    createdAt: new Date().toISOString()
  };
  D.imageLibrary = [entry, ...(D.imageLibrary || []).filter(x => x.url !== finalUrl)];

  if(targetPath){
    setp(targetPath, finalUrl);
    paintThumbs();
    const urlInput = document.querySelector(`[data-url="${targetPath}"]`);
    if(urlInput) urlInput.value = finalUrl.startsWith('data:') ? '/SK22/image/' + entry.filename : finalUrl;
    touch(targetPath);
    if(!targetPath.startsWith('ui.')){
      await save();
      toast('Đã tải lên ' + (finalUrl.startsWith('/SK22/image/') ? finalUrl : '/SK22/image/' + entry.filename) + ' & cập nhật ngay lên index.html!');
    } else {
      toast('Đã tải ảnh lên ' + (finalUrl.startsWith('/SK22/image/') ? finalUrl : '/SK22/image/' + entry.filename));
    }
  } else {
    await save();
  }
  await fetchServerImageList();
  return finalUrl;
}

async function fetchServerImageList(){
  try{
    const res = await fetch(API_IMAGE + '?list=1', {cache:'no-store'});
    if(res.ok){
      const j = await res.json();
      if(j && Array.isArray(j.images)){
        serverImages = j.images;
        if(UI.tab === 'gallery') renderView(false);
      }
    }
  }catch{}
}

function getAllGalleryImages(){
  const map = new Map();
  serverImages.forEach(im => map.set(im.url, im));
  (D.imageLibrary || []).forEach(im => {
    if(!map.has(im.url)) map.set(im.url, im);
  });
  return [...map.values()];
}

  const t=UI.tab;let lab='Xem trước trên index.html',h='';
  if(t==='intro'){const s=D.school,k=D.klass;
    h=`<div class="pv hero">${s.imageUrl?`<img class="pvbg" src="${esc(s.imageUrl)}" alt="">`:'<div class="tableau"></div>'}<div class="veil"></div><div class="pvin"><p class="sub">${esc(s.subtitle)}</p><h3>${esc(s.name)}</h3><p>${esc(s.intro)}</p><h4>${esc(k.name)}</h4><p>${esc(k.message)}</p></div></div>`}
  else if(t==='teacher')h=prof(D.teacher);
  else if(t==='students')h=prof(D.students[UI.sel]);
  else if(t==='gallery'){
    const list=getAllGalleryImages().slice(0,3);
    lab='Ảnh mới nhất trong /SK22/image/';
    h=list.length?list.map(im=>`<div class="mc"><img src="${esc(im.url)}" alt=""><small class="mono">${esc(im.url.startsWith('data:')?'/SK22/image/'+im.filename:im.url)}</small></div>`).join(''):'<p class="empty">Chưa có ảnh trong /SK22/image/.</p>';
  }
  else{const c=CR[CRKEY[t]],st=UI[c.key],live=c.fields.some(x=>st.form[x.k]);
    const items=live?[st.form]:D[c.key].filter(x=>st.filter==='all'||x.grade===st.filter).slice(0,3);
    lab=live?'Bản nháp đang soạn':'Xem trước trên index.html';
    h=items.length?items.map(c.card).join(''):'<p class="empty">Chưa có nội dung để xem trước.</p>'}
  $('#preview').innerHTML=`<p class="pvlabel">${lab}</p>${h}`;
}
const touch=p=>{if(!p.startsWith('ui.'))dirty(true);if(UI.tab==='students'&&$('#slist'))$('#slist').innerHTML=studentItems();renderPreview()};

/* ---------- Cloud API (Vercel + Neon Postgres) & Local Persistence ---------- */
async function pullFromCloud(){
  try{
    const res=await fetch(API_DATA,{method:'GET',headers:{'Accept':'application/json'},cache:'no-store'});
    if(res.ok){
      const json=await res.json();
      if(json&&json.data){
        D=normalize(json.data);
        try{localStorage.setItem(KEY,JSON.stringify(D))}catch{}
        cloudState='Đã đồng bộ Neon DB';
        if(ses){renderView(false);setSync()}
      } else {
        cloudState='Neon DB sẵn sàng';
        if(ses)setSync();
      }
      await fetchServerImageList();
      return;
    }
  }catch{}
  cloudState='Chế độ Local / Offline';
  if(ses)setSync();
}

async function save(){
  syncMirror();
  D.updatedAt=new Date().toISOString();
  try{localStorage.setItem(KEY,JSON.stringify(D))}catch{}
  try{bc&&bc.postMessage({type:'update',at:D.updatedAt})}catch{}

  setSync('Đang lưu lên Neon DB...');
  try{
    const res=await fetch(API_DATA,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-sk22-password':(ses&&ses.password)||DEFAULT_PASS,
        'Authorization':'Bearer '+((ses&&ses.password)||DEFAULT_PASS)
      },
      body:JSON.stringify({data:D})
    });
    if(res.ok){
      cloudState='Đã đồng bộ Neon DB';
      dirty(false);
      toast('Đã lưu & cập nhật ngay lên index.html!');
      return true;
    } else if(res.status===401){
      toast('Mật khẩu SK22 Member không hợp lệ trên Server!','err');
      return false;
    }
  }catch{}
  cloudState='Đã lưu Local';
  dirty(false);
  toast('Đã lưu & đồng bộ trực tiếp (Local Sync)');
  return true;
}

function external(){if(!ses)return;if(isDirty)return;D=loadLocal();renderView(false);setSync()}
bc&&(bc.onmessage=external);
addEventListener('storage',e=>{if(e.key===KEY)external()});
addEventListener('beforeunload',e=>{if(isDirty){e.preventDefault();e.returnValue=''}});
addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='s'){e.preventDefault();if(ses)save()}});

/* ---------- Navigation helper ---------- */
document.addEventListener('click',e=>{
  const homeBtn=e.target.closest('[data-go-home]');
  if(homeBtn) window.location.href='index.html';
});

/* ---------- Delegated events on the workspace ---------- */
const V=$('#view');
V.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.path!==undefined){setp(t.dataset.path,t.value);touch(t.dataset.path)}
  else if(t.dataset.url!==undefined){setp(t.dataset.url,t.value.trim());paintThumbs();touch(t.dataset.url)}
  else if(t.dataset.search!==undefined){UI.q=t.value;$('#slist').innerHTML=studentItems()}});

V.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='multiUploadInput'){
    const files=[...(t.files||[])];
    t.value='';
    if(!files.length)return;
    for(const f of files){
      try{await uploadToSK22ImageFolder(f, f.name.replace(/\.[^.]+$/,''), null)}
      catch{toast('Không tải được file '+f.name,'err')}
    }
    renderView(false);
    return;
  }
  if(t.dataset.file===undefined)return;
  const f=t.files[0],p=t.dataset.file,pref=t.dataset.prefix||'sk22';
  t.value='';
  if(!f)return;
  try{
    await uploadToSK22ImageFolder(f, pref, p);
  }catch{
    toast('Không đọc được ảnh này. Hãy thử file JPG hoặc PNG khác.','err');
  }
});

const move=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]]};
const ACT={
  pick:d=>{UI.sel=+d.i;renderView()},
  grade:d=>{UI[d.key].form.grade=d.v;renderView(false)},
  filter:d=>{UI[d.key].filter=d.v;renderView(false)},
  cancel:d=>{const st=UI[d.key];st.edit=null;st.form=blank(CR[d.key],st.filter);renderView(false)},
  edit:d=>{const c=CR[d.key],st=UI[d.key],it=D[d.key].find(x=>x.id===d.id);if(!it)return;
    st.edit=it.id;st.form=blank(c);c.fields.forEach(x=>st.form[x.k]=it[x.k]||'');if(c.grade)st.form.grade=it.grade;renderView(false);scrollTo({top:0,behavior:'smooth'})},
  del:async d=>{const it=D[d.key].find(x=>x.id===d.id);if(!it)return;
    if(!await ask('Xóa mục này?','Mục sẽ bị xóa và cập nhật ngay lên index.html.','Xóa'))return;
    D[d.key]=D[d.key].filter(x=>x.id!==d.id);syncMirror();if(UI[d.key].edit===d.id)ACT.cancel(d);dirty(true);renderView(false);await save()},
  up:async d=>{move(D[d.key],D[d.key].findIndex(x=>x.id===d.id),-1);syncMirror();dirty(true);renderView(false);await save()},
  down:async d=>{move(D[d.key],D[d.key].findIndex(x=>x.id===d.id),1);syncMirror();dirty(true);renderView(false);await save()},
  saveNow:async()=>{await save()},
  saveNext:async()=>{if(await save()){UI.sel=Math.min(D.students.length-1,UI.sel+1);renderView();V.querySelector('textarea')?.focus()}}
};

V.addEventListener('click',async e=>{
  const pickGal=e.target.closest('[data-pick-gal]');
  if(pickGal){openGalleryPicker(pickGal.dataset.pickGal);return}

  const copyBtn=e.target.closest('[data-copy-url]');
  if(copyBtn){
    const u=copyBtn.dataset.copyUrl;
    try{await navigator.clipboard.writeText(u)}catch{
      const ta=document.createElement('textarea');ta.value=u;document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove();
    }
    toast('Đã sao chép đường dẫn ảnh!');
    return;
  }

  const delImg=e.target.closest('[data-del-img]');
  if(delImg){
    const fn=delImg.dataset.delImg, url=delImg.dataset.delUrl;
    if(!await ask('Xóa ảnh khỏi /SK22/image/?','Ảnh này sẽ bị xóa khỏi kho lưu trữ /SK22/image/.','Xóa ảnh'))return;
    try{
      if(fn) await fetch(API_IMAGE+'?file='+encodeURIComponent(fn),{method:'DELETE',headers:{'x-sk22-password':(ses&&ses.password)||DEFAULT_PASS}});
    }catch{}
    D.imageLibrary=(D.imageLibrary||[]).filter(x=>x.url!==url&&x.filename!==fn);
    serverImages=serverImages.filter(x=>x.url!==url&&x.filename!==fn);
    await save();
    renderView(false);
    return;
  }

  const b=e.target.closest('[data-act],[data-clear]');if(!b||b.disabled)return;
  if(b.dataset.clear){const p=b.dataset.clear;setp(p,'');const u=V.querySelector(`[data-url="${p}"]`);if(u)u.value='';paintThumbs();touch(p);if(!p.startsWith('ui.'))await save();return}
  ACT[b.dataset.act]?.(b.dataset);
});

V.addEventListener('submit',async e=>{e.preventDefault();const k=e.target.dataset.form;
  if(k==='student'){await save();if(UI.tab==='students')$('#slist').innerHTML=studentItems();return}
  const c=CR[k],st=UI[k],f=st.form;
  if(c.fields.some(x=>x.req&&!String(f[x.k]).trim())){toast('Hãy điền các ô bắt buộc (có dấu *).','err');return}
  const clean={};c.fields.forEach(x=>clean[x.k]=String(f[x.k]).trim());if(c.grade)clean.grade=f.grade;
  if(st.edit){const it=D[k].find(x=>x.id===st.edit);if(it)Object.assign(it,clean)}
  else{D[k].push({id:uid(),by:'sk22-member',...clean})}
  syncMirror();
  st.edit=null;st.form=blank(c,st.filter);dirty(true);renderView(false);
  await save()});
$('#nav').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;UI.tab=b.dataset.tab;renderView()});

/* ---------- Data bar ---------- */
$('#bSave').onclick=()=>save();
$('#bExp').onclick=()=>{syncMirror();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='csk22-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('#bImp').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  let r;try{r=JSON.parse(await f.text());if(!r||!Array.isArray(r.students))throw 0}catch{toast('File không đúng định dạng csk22-data.json.','err');return}
  if(!await ask('Nhập dữ liệu từ file?','Toàn bộ dữ liệu hiện tại sẽ được thay bằng nội dung trong file này và đồng bộ lên Neon DB.','Nhập & lưu'))return;
  D=normalize(r);await save();renderView(false)};
$('#bReset').onclick=async()=>{
  if(!await ask('Khôi phục khung sườn gốc?','Mọi nội dung đã nhập sẽ bị xóa, chỉ giữ lại tên trường, lớp, GVCN và 35 học sinh. Hãy xuất file JSON trước nếu cần giữ bản sao.','Khôi phục'))return;
  D=skeleton();Object.values(CR).forEach(c=>UI[c.key]={edit:null,filter:'all',form:blank(c)});await save();renderView(false)};
$('#bOut').onclick=async()=>{if(isDirty&&!await ask('Đăng xuất?','Bạn còn thay đổi chưa lưu và sẽ mất nếu đăng xuất.','Đăng xuất'))return;
  isDirty=false;try{sessionStorage.removeItem(SKEY)}catch{}location.reload()};

/* ---------- Unified SK22 Member Auth Gate (Password: maihong) ---------- */
const qid=(()=>{const n=parseInt(new URLSearchParams(location.search).get('studentId'),10);return n>=1&&n<=NAMES.length?n-1:null})();

function gate(){
  $('#gate').hidden=false;
  $('#gm').textContent='';
  $('#gc').value='';
}

$('#gf').onsubmit=async e=>{
  e.preventDefault();
  const code=$('#gc').value.trim();
  const btn=$('#gBtn');
  btn.disabled=true;
  let ok=(code===DEFAULT_PASS);
  try{
    const res=await fetch(API_AUTH,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({user:'SK22 Member',password:code})
    });
    if(res.ok){
      const j=await res.json();
      if(j&&j.ok)ok=true;
    } else if(res.status===401){
      ok=false;
    }
  }catch{}
  btn.disabled=false;

  if(!ok){
    $('#gm').textContent='Mật khẩu SK22 Member chưa đúng. Vui lòng thử lại.';
    const c=$('.gcard');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake');
    $('#gc').select();
    return;
  }
  const s={role:'member',name:'SK22 Member',id:'sk22-member',password:code};
  try{sessionStorage.setItem(SKEY,JSON.stringify(s))}catch{}
  boot(s);
};

function boot(s){
  ses=s;$('#gate').hidden=true;$('#app').hidden=false;
  $('#authors').innerHTML=[TEACHER,...NAMES].map(n=>`<option value="${esc(n)}">`).join('');
  $('#who').innerHTML=`Tài khoản quản trị<br><strong style="color:var(--gold)">SK22 Member</strong>`;
  UI.tab=qid!==null?'students':'intro';
  UI.sel=qid!==null?qid:0;
  renderView();
  setSync();
  pullFromCloud();
}

/* ---------- Start ---------- */
(()=>{let s=null;try{s=JSON.parse(sessionStorage.getItem(SKEY))}catch{}
  if(s&&s.role==='member')boot(s);else gate()})();
})();
</script>
